[project]
name = "rag-chunking-evaluation-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    # Database
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    # Vector store
    "qdrant-client>=1.9",
    # LLM / embeddings
    "openai>=1.0",
    "langchain>=0.3",
    "langchain-text-splitters>=0.3",
    "langchain-community>=0.3",
    "langchain-openai>=0.2",
    # Document loaders
    "pymupdf>=1.24",
    "lxml>=5.0",
    # Evaluation (Etapa 6)
    "ragas>=0.1",
    "datasets>=2.0",
    # HTTP client
    "httpx>=0.27",
    # Numpy (dep do semantic chunker)
    "numpy>=1.26",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
